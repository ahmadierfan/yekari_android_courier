name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # امضای انتشار اختیاری است: اگر سکرت‌ها نباشند APK انتشار بدون امضا ساخته می‌شود
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YEKARI_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          echo "YEKARI_KEYSTORE=release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          YEKARI_KEYSTORE_PASSWORD: ${{ secrets.YEKARI_KEYSTORE_PASSWORD }}
          YEKARI_KEY_ALIAS: ${{ secrets.YEKARI_KEY_ALIAS }}
          YEKARI_KEY_PASSWORD: ${{ secrets.YEKARI_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDevDebug assembleProdRelease

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
