org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── پیکربندی وب‌اپ ─────────────────────────────────────────────
# همه را می‌شود بدون ویرایش فایل با -P عوض کرد، مثلاً:
#   ./gradlew assembleDevDebug -Pyekari.dev.webUrl=http://192.168.1.20:3501
#
# dev: با `adb reverse tcp:3501 tcp:3501 && adb reverse tcp:8000 tcp:8000` گوشی/شبیه‌ساز
# همان localhost لپ‌تاپ را می‌بیند؛ localhost «امن» حساب می‌شود، پس موقعیت و میکروفون
# (که فقط روی https/localhost کار می‌کنند) در حالت توسعه هم کار می‌کنند.
yekari.dev.webUrl=http://localhost:3501
yekari.dev.trustedHosts=localhost,10.0.2.2

# prod: دامنهٔ واقعی را پیش از انتشار این‌جا بگذار.
# trustedHosts = میزبان‌هایی که داخل خود اپ باز می‌شوند (خود اپ + API برای برگشت از درگاه).
# زیردامنه‌ها هم حساب‌اند: yekari.ir یعنی app.yekari.ir و api.yekari.ir هم.
yekari.prod.webUrl=https://courier.yekari.ir
yekari.prod.trustedHosts=yekari.ir

yekari.versionCode=1
yekari.versionName=0.1.0
